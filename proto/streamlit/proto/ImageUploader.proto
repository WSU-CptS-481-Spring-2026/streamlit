syntax = "proto3";


import "streamlit/proto/LabelVisibility.proto";

// image_uploader widget
message ImageUploader {
  // The widget id
  string id = 1;

  // Text to be displayed before the widget
  string label = 2;

  // Supported image types: For example: ["png", "jpg", "jpeg", "gif", "webp"]
  repeated string type = 3;

  // Max file size allowed by server config
  int32 max_upload_size_mb = 4;

  string help = 5;

  string form_id = 6;

  bool disabled = 7;

  LabelVisibility label_visibility = 8;

  optional string default = 9;
}
